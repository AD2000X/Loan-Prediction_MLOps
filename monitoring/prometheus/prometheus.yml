global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'loan-prediction-mlops'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Loan Prediction API - Local Development
  - job_name: 'loan-prediction-api-local'
    metrics_path: '/metrics'
    scrape_interval: 10s
    static_configs:
      - targets: ['host.docker.internal:8005']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'loan-api-local'

  # Loan Prediction API - AWS EKS (change target when deployed)
  # To use AWS endpoint, comment out local config above and uncomment below
  # - job_name: 'loan-prediction-api-aws'
  #   metrics_path: '/metrics'
  #   scrape_interval: 15s
  #   static_configs:
  #     - targets: ['<ALB_DNS_OR_SERVICE_URL>']
  #   relabel_configs:
  #     - source_labels: [__address__]
  #       target_label: instance
  #       replacement: 'loan-api-aws'

  # Kubernetes Service Discovery (for EKS deployment)
  # Uncomment when deploying to EKS
  # - job_name: 'kubernetes-pods'
  #   kubernetes_sd_configs:
  #     - role: pod
  #   relabel_configs:
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
  #       action: keep
  #       regex: true
  #     - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
  #       action: replace
  #       target_label: __metrics_path__
  #       regex: (.+)
  #     - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
  #       action: replace
  #       regex: ([^:]+)(?::\d+)?;(\d+)
  #       replacement: $1:$2
  #       target_label: __address__
