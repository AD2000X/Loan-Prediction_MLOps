[pytest]
# Pytest configuration for Loan Prediction MLOps

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# Coverage options (if pytest-cov is installed)
# addopts =
#     -v
#     --cov=prediction_model
#     --cov=main
#     --cov-report=html
#     --cov-report=term-missing

# Markers
markers =
    integration: Integration tests that require MLflow (deselect with '-m "not integration"')
    slow: Slow running tests
    api: API endpoint tests
    unit: Unit tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore paths
norecursedirs =
    .git
    .github
    __pycache__
    *.egg-info
    .dvc
    k8s
    monitoring
    drift_monitoring
    docs
